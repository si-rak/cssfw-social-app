<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connectify | Feed</title>

  <link rel="stylesheet" href="../dist/output.css" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
    rel="stylesheet" />

  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
</head>

<body
  class="bg-lightbg dark:bg-darkbg text-gray-900 dark:text-gray-100 font-sans flex flex-col min-h-screen transition-all duration-300">

  <!-- HEADER -->
  <header class="bg-white dark:bg-gray-900 shadow-sm sticky top-0 z-10">
    <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between px-6 py-4 gap-4">

      <!-- Logo + Toggle -->
      <div class="flex items-center gap-3">
        <a href="../index.html" class="text-2xl font-heading font-bold text-brand">Connectify</a>

        <button id="themeToggle"
          class="relative flex items-center justify-between w-12 h-6 rounded-full px-1 transition-all duration-300 bg-gradient-to-b from-gray-200 to-gray-300 dark:from-gray-800 dark:to-gray-700 shadow-inner">
          <svg class="w-3.5 h-3.5 text-yellow-500" fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M12 18a6 6 0 100-12 6 6 0 000 12zM12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
          </svg>
          <svg class="w-3.5 h-3.5 text-blue-400" fill="currentColor" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z" />
          </svg>
          <div
            class="absolute top-0.5 left-0.5 w-5 h-5 bg-gradient-to-b from-white to-gray-100 dark:from-gray-600 dark:to-gray-500 rounded-full shadow-md transform transition-transform duration-300">
          </div>
        </button>
      </div>

      <!-- Search -->
      <div class="hidden sm:flex flex-grow justify-center">
        <input type="text" placeholder="Search posts..."
          class="w-72 md:w-96 border border-gray-300 dark:border-gray-700 rounded-lg py-2 px-3 text-sm bg-white dark:bg-gray-800 focus:ring-2 focus:ring-brand" />
      </div>

      <!-- Nav -->
      <nav class="hidden sm:flex items-center gap-4 text-sm text-gray-600 dark:text-gray-300">
        <span id="userEmail" class="text-xs text-gray-400"></span>

        <button onclick="logoutUser()" class="hover:text-brand transition">
          Logout
        </button>

        <a href="./index.html" class="text-brand font-medium">Feed</a>
        <a href="../profile/index.html" class="hover:text-brand transition">Profile</a>
      </nav>
    </div>
  </header>

  <!-- MAIN -->
  <main class="flex-grow max-w-5xl mx-auto px-4 py-10 space-y-8">

    <!-- CREATE POST -->
    <section
      class="bg-cardlight dark:bg-carddark rounded-2xl shadow-lg p-6 border border-gray-200 dark:border-gray-700 space-y-4">

      <h2 class="text-lg font-heading font-semibold">Create a new post</h2>

      <form id="postForm" class="space-y-4">

        <input id="postTitle" type="text" placeholder="Post title"
          class="w-full border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-sm bg-white dark:bg-gray-900 focus:ring-2 focus:ring-brand"
          required />

        <textarea id="postContent" rows="3" placeholder="What's on your mind?"
          class="w-full border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-sm bg-white dark:bg-gray-900 resize-none focus:ring-2 focus:ring-brand"
          required></textarea>

        <div class="flex items-center justify-between flex-wrap gap-3">

          <!-- IMAGE BUTTON -->
          <label class="cursor-pointer text-sm text-gray-400">
            <input id="postImage" type="file" accept="image/*" class="hidden" />
            <span
              class="flex items-center gap-2 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-1 hover:bg-gray-100 dark:hover:bg-gray-800 transition">

              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor"
                stroke-width="2" viewBox="0 0 24 24">
                <path d="M3 7h4l2-2h6l2 2h4v12H3z" />
                <circle cx="12" cy="13" r="3" />
              </svg>

              <span>Add image</span>
            </span>
          </label>

          <!-- 🔥 UPDATED PREMIUM BUTTON -->
          <button type="submit"
            class="bg-brand hover:bg-brand-dark text-white px-6 py-2 rounded-lg shadow-md hover:shadow-lg transition-all duration-300">
            Post
          </button>

        </div>
      </form>
    </section>

    <!-- POSTS -->
    <section id="postsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="text-center text-xs text-gray-400 py-6">
    <p>© 2025 Connectify</p>
  </footer>

  <!-- SCRIPTS -->
  <script src="../src/scripts/theme.js"></script>
  <script src="../src/scripts/feed.js"></script>

  <!-- AUTH -->
  <script src="../src/scripts/auth.js"></script>
  <script>
    checkAuth();
    preventBack();
  </script>

</body>

</html>
