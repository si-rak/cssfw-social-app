<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connectify | Profile</title>

  <link rel="stylesheet" href="../dist/output.css" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
    rel="stylesheet" />

  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
</head>

<body
  class="bg-lightbg dark:bg-darkbg text-gray-900 dark:text-gray-100 font-sans flex flex-col min-h-screen transition-all duration-300">

  <!-- HEADER -->
  <header class="bg-white dark:bg-gray-900 shadow-sm sticky top-0 z-10">
    <div class="max-w-5xl mx-auto flex items-center justify-between px-6 py-4">

      <a href="../feed/index.html" class="text-2xl font-heading font-bold text-brand">Connectify</a>

      <nav class="flex items-center gap-4 text-sm text-gray-600 dark:text-gray-300">

        <span id="userEmail" class="text-xs text-gray-400"></span>

        <button onclick="logoutUser()" class="hover:text-brand transition">
          Logout
        </button>

        <a href="../feed/index.html" class="hover:text-brand transition">Feed</a>
        <a href="./index.html" class="text-brand font-medium">Profile</a>

      </nav>
    </div>
  </header>

  <!-- PROFILE HEADER -->
  <section class="relative bg-gradient-to-r from-blue-500 to-purple-600 h-52 flex items-end justify-center">
    <div class="absolute bottom-0 translate-y-1/2">
      <img src="../src/assets/images/Prf1.png"
        class="w-32 h-32 rounded-full border-4 border-white shadow-lg object-cover" />
    </div>
  </section>

  <!-- PROFILE DETAILS -->
  <section class="mt-20 text-center px-4 space-y-2">

    <h2 id="profileName" class="text-2xl font-heading font-semibold text-gray-800 dark:text-white"></h2>

    <p class="text-gray-400 text-sm">
      Your personal posts
    </p>

  </section>

  <!-- USER POSTS -->
  <main class="flex-grow max-w-5xl mx-auto px-4 py-10">

    <h3 class="text-lg font-heading font-semibold text-center mb-6">
      Your Posts
    </h3>

    <section id="postsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="text-center text-xs text-gray-400 py-6">
    <p>© 2025 Connectify</p>
  </footer>

  <!-- SCRIPTS -->
  <script src="../src/scripts/theme.js"></script>
  <script src="../src/scripts/auth.js"></script>
  <script src="../src/scripts/profile.js"></script>

  <script>
    checkAuth();
    preventBack();
  </script>

</body>

</html>
